// ToxicBots — необязательный конфиг. Параметр запуска: +exec toxicbots
cl_showtextmsg 1        // без этого сообщения ботов не видно в чате
echo "[ToxicBots] конфиг применён. Запусти карту с ботами и пиши в чат."
// боты со всем оружием (если старая версия мода оставила «только ножи» после дуэли)
bot_allow_pistols 1
bot_allow_shotguns 1
bot_allow_sub_machine_guns 1
bot_allow_rifles 1
bot_allow_machine_guns 1
bot_allow_grenades 1
bot_allow_snipers 1
// чит-панель: если игра вылетела посреди «хоровода» — раунды снова заканчиваются как обычно
mp_ignore_round_win_conditions 0
