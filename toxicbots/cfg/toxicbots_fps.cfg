// ToxicBots — облегчённая графика для слабого ПК / ноутбука на встроенной видеокарте.
// Параметры запуска в Steam:  -novid +exec toxicbots +exec toxicbots_fps
// Это обычные настройки игры (не читы). Часть из них игра запоминает в config.cfg —
// вернуть красоту можно в меню «Настройки -> Видео» или убрав +exec toxicbots_fps.
mat_queue_mode 2              // многопоточный рендер (на 2+ ядрах заметно быстрее)
fps_max 120                   // ограничение FPS: ноутбук меньше греется и не сбрасывает частоты
mat_disable_bloom 1
mat_hdr_level 0               // без HDR
mat_motion_blur_enabled 0
mat_picmip 1                  // текстуры чуть проще (меньше видеопамяти — у встройки она общая с ОЗУ)
r_3dsky 0                     // без 3D-неба
r_shadows 0                   // без теней от моделей
r_dynamic 0                   // без динамического света (вспышки, взрывы)
muzzleflash_light 0
r_waterforceexpensive 0       // дешёвая вода
r_waterforcereflectentities 0
r_WaterDrawReflection 0
r_decals 64                   // меньше следов от пуль/крови
mp_decals 32
cl_ragdoll_physics_enable 0   // трупы без физики
cl_phys_props_enable 0        // мелкие предметы без физики
cl_detaildist 0               // без травы/мелких деталей
cl_detailfade 0
props_break_max_pieces 0      // без обломков
func_break_max_pieces 0
cl_forcepreload 1             // всё грузится при загрузке карты, а не посреди раунда (меньше фризов)
// Боты тоже едят процессор. Если всё равно лагает — меньше ботов (впиши без //):
// bot_quota 6
echo "[ToxicBots] облегчённая графика применена."
