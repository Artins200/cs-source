// =====================================================================
//  ToxicHack — чит-панель ToxicBots на клавишах (только игра с ботами).
//  Подключить: в консоли  exec toxicbots_cheats
//  или в параметрах запуска Steam:  -novid +exec toxicbots +exec toxicbots_cheats
//  То же самое можно писать в чат руками: !c, !c 1 ... !c 6, !c 0
// =====================================================================
bind "INS"   "say !c"     // показать панель и уровень подозрения ботов
bind "HOME"  "say !c 1"   // аимбот (прицел сам липнет к голове, одно попадание = смерть)
bind "PGUP"  "say !c 2"   // ВХ: радар врагов по центру экрана
bind "DEL"   "say !c 3"   // спидхак
bind "END"   "say !c 4"   // бессмертие
bind "PGDN"  "say !c 5"   // бесконечные патроны
bind "F9"    "say !c 6"   // УБИТЬ ВСЕХ НА КАРТЕ
bind "F10"   "say !c 0"   // выключить всё
echo "[ToxicHack] INS — панель, HOME/PGUP/DEL/END/PGDN — читы 1-5, F9 — убить всех, F10 — выключить всё"
